name: farmlytics
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.8
  http: ^0.13.6
  image_picker: ^1.0.7
  speech_to_text: ^7.0.0
  pdf: ^3.10.8
  printing: ^5.12.0
  intl: ^0.19.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/sayur.jpg
    - assets/sayuran.jpg
    - assets/logoladentra.png
    - assets/profile.png

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logoladentra.png"