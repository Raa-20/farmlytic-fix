version: '3.8'

services:
  # Service 1: Aplikasi Flask Kita
  web_flask:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - db_mysql
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development

  # Service 2: Database MySQL
  db_mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: farmlytics_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: