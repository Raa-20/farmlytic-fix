services:
  db_mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: farmlytics_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web_flask:
    build: ./farmlytics-db  
    ports:
      - "5000:5000"
    depends_on:
      - db_mysql
    volumes:
      - ./farmlytics-db:/app
    environment:
      - FLASK_ENV=development

  frontend_website:
    build: ./farmlytics-web  
    ports:
      - "5173:5173"
    depends_on:
      - web_flask

volumes:
  mysql_data: